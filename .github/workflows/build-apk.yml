  name: Build Android APK (Zajil Assistant)

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unpacking $f..."
              unzip -o "$f"
            fi
          done

      - name: Patch project settings
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i '/dependencyResolutionManagement/,/}/d' android/settings.gradle || true
            sed -i '/FAIL_ON_PROJECT_REPOS/d' android/settings.gradle || true
          fi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          if [ -f android/app/src/main/res/drawable/ic_bird_mascot.xml ]; then
            cp android/app/src/main/res/drawable/ic_bird_mascot.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
            cp android/app/src/main/res/drawable/ic_bird_mascot.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
