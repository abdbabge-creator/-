name: Build Android APK (Zajil Assistant)

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          if [ -f zajil-assistant-android.zip ]; then
            unzip -o zajil-assistant-android.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zajil-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Zajil Assistant APK Release
          body: |
            ## 📱 تطبيق زاجل المساعد الشخصي للأندرويد
            تم بناء ملف APK بنجاح! حمل ملف app-debug.apk المرفق أدناه وثبته على هاتفك.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
