name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unpacking $f..."
              unzip -q -o "$f" || true
            fi
          done

      - name: Patch project settings
        run: |
          ANDROID_DIR=$(find . -maxdepth 3 -name "settings.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$ANDROID_DIR" ]; then
            echo "Found Android directory: $ANDROID_DIR"
            sed -i '/dependencyResolutionManagement/,/}/d' "$ANDROID_DIR/settings.gradle" || true
            sed -i '/FAIL_ON_PROJECT_REPOS/d' "$ANDROID_DIR/settings.gradle" || true
            mkdir -p "$ANDROID_DIR/app/src/main/res/mipmap-anydpi-v26"
            if [ -f "$ANDROID_DIR/app/src/main/res/drawable/ic_bird_mascot.xml" ]; then
              cp "$ANDROID_DIR/app/src/main/res/drawable/ic_bird_mascot.xml" "$ANDROID_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" || true
              cp "$ANDROID_DIR/app/src/main/res/drawable/ic_bird_mascot.xml" "$ANDROID_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" || true
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK with Gradle
        run: |
          ANDROID_DIR=$(find . -maxdepth 3 -name "settings.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Could not find settings.gradle!"
            exit 1
          fi
          cd "$ANDROID_DIR"
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 30
